<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MySocial Friends</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #79a2e0;
            color: #1c1e21;
        }

        /* NAVBAR */

        .navbar {
            height: 64px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #1877f2;
        }

        .home-btn {
            text-decoration: none;
            background: #e4e6eb;
            color: #111;
            padding: 9px 16px;
            border-radius: 7px;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #d8dadf;
        }

        /* MAIN */

        .container {
            width: 650px;
            max-width: calc(100% - 30px);
            margin: 25px auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* SEARCH */

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .search-input:focus {
            border-color: #1877f2;
        }

        .search-btn {
            border: none;
            background: #1877f2;
            color: white;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .search-btn:hover {
            background: #166fe5;
        }

        /* USER */

        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #e4e6eb;
        }

        .user-card:last-child {
            border-bottom: none;
        }

        .avatar {
            width: 45px;
            height: 45px;
            min-width: 45px;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: bold;
            font-size: 15px;
        }

        .user-email {
            font-size: 13px;
            color: #65676b;
            margin-top: 3px;
            word-break: break-word;
        }

        /* ADD FRIEND */

        .add-btn {
            border: none;
            background: #1877f2;
            color: white;
            padding: 8px 12px;
            border-radius: 7px;
            font-weight: bold;
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #166fe5;
        }

        .add-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ACCEPT / REJECT */

        .accept-btn {
            border: none;
            background: #42b72a;
            color: white;
            padding: 8px 12px;
            border-radius: 7px;
            font-weight: bold;
            margin-right: 5px;
        }

        .accept-btn:hover {
            background: #36a420;
        }

        .reject-btn {
            border: none;
            background: #e4e6eb;
            color: #111;
            padding: 8px 12px;
            border-radius: 7px;
            font-weight: bold;
        }

        .reject-btn:hover {
            background: #d8dadf;
        }

        .friend {
            color: #42b72a;
            font-weight: bold;
            white-space: nowrap;
        }

        .pending {
            color: #65676b;
            font-weight: bold;
            white-space: nowrap;
            font-size: 13px;
        }

        .message {
            padding: 10px 0;
            color: #65676b;
        }

        .error {
            color: #e41e3f;
            font-size: 14px;
            line-height: 1.5;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 12px;
            }

            .logo {
                font-size: 23px;
            }

            .container {
                max-width: calc(100% - 20px);
            }

            .search-box {
                flex-direction: column;
            }

            .search-btn {
                padding: 12px;
            }

            .user-card {
                align-items: flex-start;
            }

            .request-buttons {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

            .accept-btn,
            .reject-btn {
                margin-right: 0;
            }

            .add-btn {
                padding: 7px 9px;
                font-size: 12px;
            }

        }

    </style>

</head>


<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            MySocial
        </div>

        <a href="home.html" class="home-btn">
            ← Home
        </a>

    </div>


    <!-- MAIN -->

    <div class="container">


        <!-- SEARCH FRIENDS -->

        <div class="card">

            <h2>
                Find Friends
            </h2>

            <div class="search-box">

                <input
                    type="email"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search by email address"
                >

                <button
                    id="searchBtn"
                    class="search-btn">

                    Search

                </button>

            </div>


            <div id="searchResults">

                <div class="message">
                    Search for a friend using their email address.
                </div>

            </div>

        </div>


        <!-- FRIEND REQUESTS -->

        <div class="card">

            <h2>
                Friend Requests
            </h2>

            <div id="requests">
                Loading...
            </div>

        </div>


        <!-- MY FRIENDS -->

        <div class="card">

            <h2>
                My Friends
            </h2>

            <div id="friends">
                Loading...
            </div>

        </div>


    </div>


    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            addDoc,
            updateDoc,
            doc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyA0jZCLoUdlC8ZghIMUSbBmrkucw6f6va4",

            authDomain:
                "mysocial-6f06e.firebaseapp.com",

            projectId:
                "mysocial-6f06e",

            storageBucket:
                "mysocial-6f06e.firebasestorage.app",

            messagingSenderId:
                "78141811564",

            appId:
                "1:78141811564:web:3ebc1dba5303e552a12149"

        };


        /* =========================
           INITIALIZE
        ========================= */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        let currentUser = null;


        const requestsDiv =
            document.getElementById("requests");

        const friendsDiv =
            document.getElementById("friends");

        const searchResultsDiv =
            document.getElementById("searchResults");


        /* =========================
           SAFE TEXT
        ========================= */

        function safeString(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }

            return String(value);

        }


        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent =
                safeString(value);

            return div.innerHTML;

        }


        function getInitials(
            name,
            email
        ) {

            let text =
                safeString(name).trim();


            if (!text) {

                text =
                    safeString(email).trim();

            }


            if (!text) {

                return "U";

            }


            const parts =
                text.split(/\s+/);


            if (
                parts.length >= 2
            ) {

                return (
                    parts[0].charAt(0) +
                    parts[1].charAt(0)
                ).toUpperCase();

            }


            return text
                .substring(0, 2)
                .toUpperCase();

        }


        /* =========================
           LOGIN
        ========================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    window.location.href =
                        "index.html";

                    return;

                }


                currentUser =
                    user;


                console.log(
                    "Logged in:",
                    user.uid,
                    user.email
                );


                await loadRequests();

                await loadFriends();

            }
        );


        /* =========================
           SEARCH USERS
        ========================= */

        document.getElementById(
            "searchBtn"
        ).addEventListener(
            "click",
            searchUsers
        );


        document.getElementById(
            "searchInput"
        ).addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter"
                ) {

                    searchUsers();

                }

            }
        );


        async function searchUsers() {

            const searchValue =
                document
                    .getElementById("searchInput")
                    .value
                    .trim()
                    .toLowerCase();


            if (!searchValue) {

                searchResultsDiv.innerHTML = `

                    <div class="message">

                        Enter an email address to search.

                    </div>

                `;

                return;

            }


            searchResultsDiv.innerHTML = `

                <div class="message">
                    Searching...
                </div>

            `;


            try {

                /*
                 * Users are searched by email.
                 *
                 * This requires user profiles to exist
                 * inside the Firestore "users" collection.
                 */

                const usersQuery =
                    query(
                        collection(
                            db,
                            "users"
                        ),
                        where(
                            "email",
                            "==",
                            searchValue
                        )
                    );


                const snapshot =
                    await getDocs(
                        usersQuery
                    );


                searchResultsDiv.innerHTML =
                    "";


                if (snapshot.empty) {

                    searchResultsDiv.innerHTML = `

                        <div class="message">

                            No user found with this email.

                        </div>

                    `;

                    return;

                }


                for (
                    const userDoc of snapshot.docs
                ) {

                    const data =
                        userDoc.data();


                    const foundUid =
                        userDoc.id;


                    if (
                        foundUid ===
                        currentUser.uid
                    ) {

                        searchResultsDiv.innerHTML = `

                            <div class="message">

                                This is your own account.

                            </div>

                        `;

                        continue;

                    }


                    const name =
                        safeString(
                            data.name
                        );


                    const email =
                        safeString(
                            data.email ||
                            data.userEmail ||
                            searchValue
                        );


                    await displaySearchResult(
                        foundUid,
                        name,
                        email
                    );

                }


            } catch (error) {

                console.error(
                    "SEARCH ERROR:",
                    error
                );


                searchResultsDiv.innerHTML = `

                    <div class="error">

                        Could not search users.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        }


        /* =========================
           SEARCH RESULT
        ========================= */

        async function displaySearchResult(
            uid,
            name,
            email
        ) {

            const relationship =
                await getRelationship(
                    uid
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "user-card";


            let actionHTML = "";


            if (
                relationship ===
                "friends"
            ) {

                actionHTML = `

                    <div class="friend">
                        ✓ Friends
                    </div>

                `;

            }

            else if (
                relationship ===
                "sent"
            ) {

                actionHTML = `

                    <div class="pending">
                        Request Sent
                    </div>

                `;

            }

            else if (
                relationship ===
                "received"
            ) {

                actionHTML = `

                    <div class="pending">
                        Request Received
                    </div>

                `;

            }

            else {

                actionHTML = `

                    <button
                        class="add-btn">

                        Add Friend

                    </button>

                `;

            }


            card.innerHTML = `

                <div class="avatar">

                    ${escapeHTML(
                        getInitials(
                            name,
                            email
                        )
                    )}

                </div>


                <div class="user-info">

                    <div class="user-name">

                        ${escapeHTML(
                            name || "User"
                        )}

                    </div>


                    <div class="user-email">

                        ${escapeHTML(
                            email
                        )}

                    </div>

                </div>


                ${actionHTML}

            `;


            searchResultsDiv.appendChild(
                card
            );


            const addButton =
                card.querySelector(
                    ".add-btn"
                );


            if (addButton) {

                addButton.addEventListener(
                    "click",
                    async () => {

                        addButton.disabled =
                            true;

                        addButton.textContent =
                            "Sending...";


                        try {

                            await addDoc(

                                collection(
                                    db,
                                    "friendRequests"
                                ),

                                {

                                    from:
                                        currentUser.uid,

                                    fromEmail:
                                        currentUser.email,

                                    to:
                                        uid,

                                    toEmail:
                                        email,

                                    status:
                                        "pending",

                                    createdAt:
                                        serverTimestamp()

                                }

                            );


                            addButton.textContent =
                                "Request Sent";


                            alert(
                                "Friend request sent!"
                            );


                        } catch (error) {

                            console.error(
                                "ADD FRIEND ERROR:",
                                error
                            );


                            addButton.disabled =
                                false;


                            addButton.textContent =
                                "Add Friend";


                            alert(
                                "Could not send friend request: " +
                                error.message
                            );

                        }

                    }
                );

            }

        }


        /* =========================
           CHECK RELATIONSHIP
        ========================= */

        async function getRelationship(
            otherUid
        ) {

            try {

                // SENT

                const sentQuery =
                    query(

                        collection(
                            db,
                            "friendRequests"
                        ),

                        where(
                            "from",
                            "==",
                            currentUser.uid
                        ),

                        where(
                            "to",
                            "==",
                            otherUid
                        )

                    );


                const sentSnapshot =
                    await getDocs(
                        sentQuery
                    );


                if (
                    !sentSnapshot.empty
                ) {

                    const data =
                        sentSnapshot.docs[0]
                            .data();


                    if (
                        data.status ===
                        "accepted"
                    ) {

                        return "friends";

                    }


                    if (
                        data.status ===
                        "pending"
                    ) {

                        return "sent";

                    }

                }


                // RECEIVED

                const receivedQuery =
                    query(

                        collection(
                            db,
                            "friendRequests"
                        ),

                        where(
                            "from",
                            "==",
                            otherUid
                        ),

                        where(
                            "to",
                            "==",
                            currentUser.uid
                        )

                    );


                const receivedSnapshot =
                    await getDocs(
                        receivedQuery
                    );


                if (
                    !receivedSnapshot.empty
                ) {

                    const data =
                        receivedSnapshot.docs[0]
                            .data();


                    if (
                        data.status ===
                        "accepted"
                    ) {

                        return "friends";

                    }


                    if (
                        data.status ===
                        "pending"
                    ) {

                        return "received";

                    }

                }


                return "none";


            } catch (error) {

                console.error(
                    "RELATIONSHIP ERROR:",
                    error
                );


                return "none";

            }

        }


        /* =========================
           LOAD FRIEND REQUESTS
        ========================= */

        async function loadRequests() {

            requestsDiv.innerHTML =
                `<div class="message">
                    Loading...
                </div>`;


            try {

                const requestsQuery =
                    query(

                        collection(
                            db,
                            "friendRequests"
                        ),

                        where(
                            "to",
                            "==",
                            currentUser.uid
                        ),

                        where(
                            "status",
                            "==",
                            "pending"
                        )

                    );


                const snapshot =
                    await getDocs(
                        requestsQuery
                    );


                requestsDiv.innerHTML =
                    "";


                if (
                    snapshot.empty
                ) {

                    requestsDiv.innerHTML =
                        `<div class="message">
                            No friend requests.
                        </div>`;

                    return;

                }


                snapshot.forEach(
                    (requestDoc) => {

                        const data =
                            requestDoc.data();


                        const fromEmail =
                            safeString(
                                data.fromEmail
                            );


                        const fromUid =
                            safeString(
                                data.from
                            );


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "user-card";


                        card.innerHTML = `

                            <div class="avatar">

                                ${escapeHTML(
                                    getInitials(
                                        "",
                                        fromEmail
                                    )
                                )}

                            </div>


                            <div class="user-info">

                                <div class="user-name">
                                    Friend Request
                                </div>

                                <div class="user-email">

                                    ${escapeHTML(
                                        fromEmail ||
                                        "User"
                                    )}

                                </div>

                            </div>


                            <div class="request-buttons">

                                <button
                                    class="accept-btn">

                                    Accept

                                </button>


                                <button
                                    class="reject-btn">

                                    Reject

                                </button>

                            </div>

                        `;


                        requestsDiv.appendChild(
                            card
                        );


                        const acceptButton =
                            card.querySelector(
                                ".accept-btn"
                            );


                        const rejectButton =
                            card.querySelector(
                                ".reject-btn"
                            );


                        /* ACCEPT */

                        acceptButton.addEventListener(
                            "click",
                            async () => {

                                acceptButton.disabled =
                                    true;

                                rejectButton.disabled =
                                    true;


                                try {

                                    await updateDoc(

                                        doc(
                                            db,
                                            "friendRequests",
                                            requestDoc.id
                                        ),

                                        {
                                            status:
                                                "accepted"
                                        }

                                    );


                                    alert(
                                        "Friend request accepted!"
                                    );


                                    await loadRequests();

                                    await loadFriends();


                                } catch (error) {

                                    console.error(
                                        "Accept error:",
                                        error
                                    );


                                    alert(
                                        "Could not accept request: " +
                                        error.message
                                    );


                                    acceptButton.disabled =
                                        false;

                                    rejectButton.disabled =
                                        false;

                                }

                            }
                        );


                        /* REJECT */

                        rejectButton.addEventListener(
                            "click",
                            async () => {

                                rejectButton.disabled =
                                    true;

                                acceptButton.disabled =
                                    true;


                                try {

                                    await updateDoc(

                                        doc(
                                            db,
                                            "friendRequests",
                                            requestDoc.id
                                        ),

                                        {
                                            status:
                                                "rejected"
                                        }

                                    );


                                    await loadRequests();


                                } catch (error) {

                                    console.error(
                                        "Reject error:",
                                        error
                                    );


                                    alert(
                                        "Could not reject request: " +
                                        error.message
                                    );


                                    rejectButton.disabled =
                                        false;

                                    acceptButton.disabled =
                                        false;

                                }

                            }
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "REQUEST ERROR:",
                    error
                );


                requestsDiv.innerHTML = `

                    <div class="error">

                        Could not load friend requests.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        }


        /* =========================
           LOAD MY FRIENDS
        ========================= */

        async function loadFriends() {

            friendsDiv.innerHTML =
                `<div class="message">
                    Loading...
                </div>`;


            try {

                const friendsMap =
                    new Map();


                /* SENT ACCEPTED */

                const sentQuery =
                    query(

                        collection(
                            db,
                            "friendRequests"
                        ),

                        where(
                            "from",
                            "==",
                            currentUser.uid
                        ),

                        where(
                            "status",
                            "==",
                            "accepted"
                        )

                    );


                const sentSnapshot =
                    await getDocs(
                        sentQuery
                    );


                sentSnapshot.forEach(
                    (friendDoc) => {

                        const data =
                            friendDoc.data();


                        const uid =
                            safeString(
                                data.to
                            );


                        const email =
                            safeString(
                                data.toEmail
                            );


                        if (uid) {

                            friendsMap.set(
                                uid,
                                {
                                    email:
                                        email
                                }
                            );

                        }

                    }
                );


                /* RECEIVED ACCEPTED */

                const receivedQuery =
                    query(

                        collection(
                            db,
                            "friendRequests"
                        ),

                        where(
                            "to",
                            "==",
                            currentUser.uid
                        ),

                        where(
                            "status",
                            "==",
                            "accepted"
                        )

                    );


                const receivedSnapshot =
                    await getDocs(
                        receivedQuery
                    );


                receivedSnapshot.forEach(
                    (friendDoc) => {

                        const data =
                            friendDoc.data();


                        const uid =
                            safeString(
                                data.from
                            );


                        const email =
                            safeString(
                                data.fromEmail
                            );


                        if (uid) {

                            friendsMap.set(
                                uid,
                                {
                                    email:
                                        email
                                }
                            );

                        }

                    }
                );


                friendsDiv.innerHTML =
                    "";


                if (
                    friendsMap.size === 0
                ) {

                    friendsDiv.innerHTML =
                        `<div class="message">
                            You don't have any friends yet.
                        </div>`;

                    return;

                }


                friendsMap.forEach(
                    (friend) => {

                        const email =
                            safeString(
                                friend.email
                            );


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "user-card";


                        card.innerHTML = `

                            <div class="avatar">

                                ${escapeHTML(
                                    getInitials(
                                        "",
                                        email
                                    )
                                )}

                            </div>


                            <div class="user-info">

                                <div class="user-name">
                                    Friend
                                </div>


                                <div class="user-email">

                                    ${escapeHTML(
                                        email ||
                                        "User"
                                    )}

                                </div>

                            </div>


                            <div class="friend">

                                ✓ Friends

                            </div>

                        `;


                        friendsDiv.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "FRIENDS ERROR:",
                    error
                );


                friendsDiv.innerHTML = `

                    <div class="error">

                        Could not load friends.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        }

    </script>

</body>

</html>
