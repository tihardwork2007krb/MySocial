<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MySocial Friends</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #79a2e0;
            color: #1c1e21;
        }

        /* NAVBAR */

        .navbar {
            height: 64px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #1877f2;
        }

        .home-btn {
            text-decoration: none;
            background: #e4e6eb;
            color: #111;
            padding: 9px 16px;
            border-radius: 7px;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #d8dadf;
        }

        /* MAIN */

        .container {
            width: 650px;
            max-width: calc(100% - 30px);
            margin: 25px auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* USER */

        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #e4e6eb;
        }

        .user-card:last-child {
            border-bottom: none;
        }

        .avatar {
            width: 45px;
            height: 45px;
            min-width: 45px;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: bold;
            font-size: 15px;
        }

        .user-email {
            font-size: 13px;
            color: #65676b;
            margin-top: 3px;
            word-break: break-word;
        }

        /* BUTTONS */

        button {
            cursor: pointer;
        }

        .accept-btn {
            border: none;
            background: #42b72a;
            color: white;
            padding: 8px 12px;
            border-radius: 7px;
            font-weight: bold;
            margin-right: 5px;
        }

        .accept-btn:hover {
            background: #36a420;
        }

        .reject-btn {
            border: none;
            background: #e4e6eb;
            color: #111;
            padding: 8px 12px;
            border-radius: 7px;
            font-weight: bold;
        }

        .reject-btn:hover {
            background: #d8dadf;
        }

        .friend {
            color: #42b72a;
            font-weight: bold;
            white-space: nowrap;
        }

        .message {
            padding: 10px 0;
            color: #65676b;
        }

        .error {
            color: #e41e3f;
            font-size: 14px;
            line-height: 1.5;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 12px;
            }

            .logo {
                font-size: 23px;
            }

            .container {
                max-width: calc(100% - 20px);
            }

            .user-card {
                align-items: flex-start;
            }

            .request-buttons {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

            .accept-btn,
            .reject-btn {
                margin-right: 0;
            }

        }

    </style>

</head>


<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            MySocial
        </div>

        <a href="home.html" class="home-btn">
            ← Home
        </a>

    </div>


    <!-- MAIN -->

    <div class="container">


        <!-- FRIEND REQUESTS -->

        <div class="card">

            <h2>
                Friend Requests
            </h2>

            <div id="requests">
                Loading...
            </div>

        </div>


        <!-- MY FRIENDS -->

        <div class="card">

            <h2>
                My Friends
            </h2>

            <div id="friends">
                Loading...
            </div>

        </div>


    </div>


    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            updateDoc,
            doc
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyA0jZCLoUdlC8ZghIMUSbBmrkucw6f6va4",

            authDomain:
                "mysocial-6f06e.firebaseapp.com",

            projectId:
                "mysocial-6f06e",

            storageBucket:
                "mysocial-6f06e.firebasestorage.app",

            messagingSenderId:
                "78141811564",

            appId:
                "1:78141811564:web:3ebc1dba5303e552a12149"

        };


        /* =========================
           INITIALIZE
        ========================= */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        let currentUser = null;


        const requestsDiv =
            document.getElementById("requests");

        const friendsDiv =
            document.getElementById("friends");


        /* =========================
           SAFE TEXT FUNCTIONS
        ========================= */

        function safeString(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value);

        }


        function getInitials(name, email) {

            let text =
                safeString(name).trim();

            if (!text) {
                text =
                    safeString(email).trim();
            }

            if (!text) {
                return "U";
            }

            const parts =
                text.split(/\s+/);

            if (parts.length >= 2) {

                return (
                    parts[0].charAt(0) +
                    parts[1].charAt(0)
                ).toUpperCase();

            }

            return text
                .substring(0, 2)
                .toUpperCase();

        }


        /* =========================
           LOGIN
        ========================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    window.location.href =
                        "index.html";

                    return;

                }


                currentUser = user;


                console.log(
                    "Logged in:",
                    user.uid,
                    user.email
                );


                await loadRequests();

                await loadFriends();

            }
        );


        /* =========================
           LOAD FRIEND REQUESTS
        ========================= */

        async function loadRequests() {

            requestsDiv.innerHTML =
                `<div class="message">
                    Loading...
                </div>`;


            try {

                const requestsQuery =
                    query(
                        collection(
                            db,
                            "friendRequests"
                        ),
                        where(
                            "to",
                            "==",
                            currentUser.uid
                        ),
                        where(
                            "status",
                            "==",
                            "pending"
                        )
                    );


                const snapshot =
                    await getDocs(
                        requestsQuery
                    );


                requestsDiv.innerHTML = "";


                if (snapshot.empty) {

                    requestsDiv.innerHTML =
                        `<div class="message">
                            No friend requests.
                        </div>`;

                    return;

                }


                snapshot.forEach(
                    (requestDoc) => {

                        const data =
                            requestDoc.data();


                        const fromEmail =
                            safeString(
                                data.fromEmail
                            );


                        const fromUid =
                            safeString(
                                data.from
                            );


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "user-card";


                        const avatar =
                            getInitials(
                                "",
                                fromEmail
                            );


                        card.innerHTML = `

                            <div class="avatar">
                                ${avatar}
                            </div>

                            <div class="user-info">

                                <div class="user-name">
                                    Friend Request
                                </div>

                                <div class="user-email">
                                    ${fromEmail || "User"}
                                </div>

                            </div>

                            <div class="request-buttons">

                                <button
                                    class="accept-btn">
                                    Accept
                                </button>

                                <button
                                    class="reject-btn">
                                    Reject
                                </button>

                            </div>

                        `;


                        requestsDiv.appendChild(
                            card
                        );


                        const acceptButton =
                            card.querySelector(
                                ".accept-btn"
                            );


                        const rejectButton =
                            card.querySelector(
                                ".reject-btn"
                            );


                        /* ACCEPT */

                        acceptButton.addEventListener(
                            "click",
                            async () => {

                                acceptButton.disabled =
                                    true;

                                rejectButton.disabled =
                                    true;


                                try {

                                    await updateDoc(
                                        doc(
                                            db,
                                            "friendRequests",
                                            requestDoc.id
                                        ),
                                        {
                                            status:
                                                "accepted"
                                        }
                                    );


                                    alert(
                                        "Friend request accepted!"
                                    );


                                    await loadRequests();

                                    await loadFriends();


                                } catch (error) {

                                    console.error(
                                        "Accept error:",
                                        error
                                    );


                                    alert(
                                        "Could not accept request: " +
                                        error.message
                                    );


                                    acceptButton.disabled =
                                        false;

                                    rejectButton.disabled =
                                        false;

                                }

                            }
                        );


                        /* REJECT */

                        rejectButton.addEventListener(
                            "click",
                            async () => {

                                rejectButton.disabled =
                                    true;

                                acceptButton.disabled =
                                    true;


                                try {

                                    await updateDoc(
                                        doc(
                                            db,
                                            "friendRequests",
                                            requestDoc.id
                                        ),
                                        {
                                            status:
                                                "rejected"
                                        }
                                    );


                                    await loadRequests();


                                } catch (error) {

                                    console.error(
                                        "Reject error:",
                                        error
                                    );


                                    alert(
                                        "Could not reject request: " +
                                        error.message
                                    );


                                    rejectButton.disabled =
                                        false;

                                    acceptButton.disabled =
                                        false;

                                }

                            }
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "REQUEST ERROR:",
                    error
                );


                requestsDiv.innerHTML = `

                    <div class="error">

                        Could not load friend requests.

                        <br><br>

                        ${safeString(error.message)}

                    </div>

                `;

            }

        }


        /* =========================
           LOAD MY FRIENDS
        ========================= */

        async function loadFriends() {

            friendsDiv.innerHTML =
                `<div class="message">
                    Loading...
                </div>`;


            try {

                const friendsMap =
                    new Map();


                /* =========================
                   SENT ACCEPTED REQUESTS
                ========================= */

                const sentQuery =
                    query(
                        collection(
                            db,
                            "friendRequests"
                        ),
                        where(
                            "from",
                            "==",
                            currentUser.uid
                        ),
                        where(
                            "status",
                            "==",
                            "accepted"
                        )
                    );


                const sentSnapshot =
                    await getDocs(
                        sentQuery
                    );


                sentSnapshot.forEach(
                    (friendDoc) => {

                        const data =
                            friendDoc.data();


                        const uid =
                            safeString(
                                data.to
                            );


                        const email =
                            safeString(
                                data.toEmail
                            );


                        if (uid) {

                            friendsMap.set(
                                uid,
                                {
                                    email: email
                                }
                            );

                        }

                    }
                );


                /* =========================
                   RECEIVED ACCEPTED REQUESTS
                ========================= */

                const receivedQuery =
                    query(
                        collection(
                            db,
                            "friendRequests"
                        ),
                        where(
                            "to",
                            "==",
                            currentUser.uid
                        ),
                        where(
                            "status",
                            "==",
                            "accepted"
                        )
                    );


                const receivedSnapshot =
                    await getDocs(
                        receivedQuery
                    );


                receivedSnapshot.forEach(
                    (friendDoc) => {

                        const data =
                            friendDoc.data();


                        const uid =
                            safeString(
                                data.from
                            );


                        const email =
                            safeString(
                                data.fromEmail
                            );


                        if (uid) {

                            friendsMap.set(
                                uid,
                                {
                                    email: email
                                }
                            );

                        }

                    }
                );


                friendsDiv.innerHTML = "";


                /* =========================
                   NO FRIENDS
                ========================= */

                if (
                    friendsMap.size === 0
                ) {

                    friendsDiv.innerHTML =
                        `<div class="message">
                            You don't have any friends yet.
                        </div>`;

                    return;

                }


                /* =========================
                   DISPLAY FRIENDS
                ========================= */

                friendsMap.forEach(
                    (friend) => {

                        const email =
                            safeString(
                                friend.email
                            );


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "user-card";


                        const avatar =
                            getInitials(
                                "",
                                email
                            );


                        card.innerHTML = `

                            <div class="avatar">
                                ${avatar}
                            </div>

                            <div class="user-info">

                                <div class="user-name">
                                    Friend
                                </div>

                                <div class="user-email">
                                    ${email || "User"}
                                </div>

                            </div>

                            <div class="friend">
                                ✓ Friends
                            </div>

                        `;


                        friendsDiv.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "FRIENDS ERROR:",
                    error
                );


                friendsDiv.innerHTML = `

                    <div class="error">

                        Could not load friends.

                        <br><br>

                        ${safeString(error.message)}

                    </div>

                `;

            }

        }

    </script>

</body>

</html>
