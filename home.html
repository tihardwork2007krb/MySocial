<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        getFirestore,
        collection,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        getDoc,
        getDocs,
        serverTimestamp,
        onSnapshot,
        query,
        where,
        orderBy
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {

        apiKey:
            "AIzaSyA0jZCLoUdlC8ZghIMUSbBmrkucw6f6va4",

        authDomain:
            "mysocial-6f06e.firebaseapp.com",

        projectId:
            "mysocial-6f06e",

        storageBucket:
            "mysocial-6f06e.firebasestorage.app",

        messagingSenderId:
            "78141811564",

        appId:
            "1:78141811564:web:3ebc1dba5303e552a12149",

        measurementId:
            "G-E19NQ06DZB"
    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    const postsContainer =
        document.getElementById("posts");


    let currentUser = null;

    let allowedUserIds = new Set();

    let unsubscribePosts = null;


    // =========================
    // LOGIN
    // =========================

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                window.location.href =
                    "index.html";

                return;
            }


            currentUser = user;


            document.getElementById(
                "userEmail"
            ).textContent =
                user.email || "User";


            // Check profile

            try {

                const profileRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const profileSnapshot =
                    await getDoc(
                        profileRef
                    );


                if (
                    !profileSnapshot.exists()
                ) {

                    window.location.href =
                        "profile.html";

                    return;
                }


                const profileData =
                    profileSnapshot.data();


                if (
                    !profileData.name ||
                    profileData.name.trim() === ""
                ) {

                    window.location.href =
                        "profile.html";

                    return;
                }


                // Load friends first

                await loadAllowedUsers();


                // Then load posts

                loadPosts();


            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );

                postsContainer.innerHTML = `

                    <div class="message">

                        Error loading your profile.

                        <br><br>

                        ${error.message}

                    </div>

                `;

            }

        }
    );


    // =========================
    // LOAD ACCEPTED FRIENDS
    // =========================

    async function loadAllowedUsers() {

        allowedUserIds =
            new Set();


        // Always allow own posts

        allowedUserIds.add(
            currentUser.uid
        );


        try {

            // FRIENDS WHERE I AM FROM

            const sentQuery =
                query(
                    collection(
                        db,
                        "friendRequests"
                    ),
                    where(
                        "from",
                        "==",
                        currentUser.uid
                    ),
                    where(
                        "status",
                        "==",
                        "accepted"
                    )
                );


            const sentSnapshot =
                await getDocs(
                    sentQuery
                );


            sentSnapshot.forEach(
                (requestDoc) => {

                    const data =
                        requestDoc.data();


                    if (data.to) {

                        allowedUserIds.add(
                            data.to
                        );

                    }

                }
            );


            // FRIENDS WHERE I AM RECEIVER

            const receivedQuery =
                query(
                    collection(
                        db,
                        "friendRequests"
                    ),
                    where(
                        "to",
                        "==",
                        currentUser.uid
                    ),
                    where(
                        "status",
                        "==",
                        "accepted"
                    )
                );


            const receivedSnapshot =
                await getDocs(
                    receivedQuery
                );


            receivedSnapshot.forEach(
                (requestDoc) => {

                    const data =
                        requestDoc.data();


                    if (data.from) {

                        allowedUserIds.add(
                            data.from
                        );

                    }

                }
            );


            console.log(
                "Allowed users:",
                [...allowedUserIds]
            );


        } catch (error) {

            console.error(
                "FRIENDS LOAD ERROR:",
                error
            );

        }

    }


    // =========================
    // LOAD POSTS
    // =========================

    function loadPosts() {

        if (unsubscribePosts) {

            unsubscribePosts();

        }


        const postsQuery =
            query(
                collection(
                    db,
                    "posts"
                ),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        unsubscribePosts =
            onSnapshot(
                postsQuery,
                (snapshot) => {

                    postsContainer.innerHTML =
                        "";


                    let visiblePosts =
                        0;


                    snapshot.forEach(
                        (postDoc) => {

                            const data =
                                postDoc.data();


                            // IMPORTANT:
                            // Only display own posts
                            // or accepted friend's posts.

                            if (
                                !allowedUserIds.has(
                                    data.uid
                                )
                            ) {

                                return;

                            }


                            visiblePosts++;


                            displayPost(
                                postDoc.id,
                                data
                            );

                        }
                    );


                    if (
                        visiblePosts === 0
                    ) {

                        postsContainer.innerHTML = `

                            <div class="message">

                                No posts from you or your friends yet.

                            </div>

                        `;

                    }

                },

                (error) => {

                    console.error(
                        "POST LOAD ERROR:",
                        error
                    );


                    postsContainer.innerHTML = `

                        <div class="message">

                            Could not load posts.

                            <br><br>

                            ${error.message}

                        </div>

                    `;

                }
            );

    }


    // =========================
    // DISPLAY POST
    // =========================

    function displayPost(
        postId,
        postData
    ) {

        const post =
            document.createElement(
                "div"
            );


        post.className =
            "post";


        const email =
            postData.userEmail ||
            "User";


        const avatar =
            email
                .substring(0, 2)
                .toUpperCase();


        const text =
            postData.text || "";


        let timeText =
            "Just now";


        if (
            postData.createdAt
        ) {

            try {

                timeText =
                    postData.createdAt
                        .toDate()
                        .toLocaleString();

            } catch (error) {

                console.log(
                    "Time conversion error"
                );

            }

        }


        const likes =
            Number(
                postData.likes || 0
            );


        const likedBy =
            Array.isArray(
                postData.likedBy
            )
            ? postData.likedBy
            : [];


        const userLiked =
            currentUser &&
            likedBy.includes(
                currentUser.uid
            );


        const isOwner =
            currentUser &&
            currentUser.uid ===
            postData.uid;


        post.innerHTML = `

            <div class="post-header">

                <div class="avatar">

                    ${avatar}

                </div>


                <div>

                    <div class="post-user">

                        ${escapeHTML(email)}

                    </div>


                    <div class="post-time">

                        ${timeText}

                    </div>

                </div>

            </div>


            <div class="post-content">

                ${escapeHTML(text)}

            </div>


            <div class="post-actions">

                <button
                    class="action-btn like-btn">

                    ${userLiked
                        ? "❤️ Liked"
                        : "👍 Like"}

                </button>


                <button
                    class="action-btn comment-btn">

                    💬 Comment

                </button>


                ${
                    isOwner
                    ? `

                        <button
                            class="action-btn delete-post-btn">

                            🗑️ Delete

                        </button>

                      `
                    : ""
                }

            </div>


            <div class="like-count">

                Likes: ${likes}

            </div>


            <div class="comments-section">

                <button
                    class="show-comments-btn">

                    💬 View comments

                </button>


                <div
                    class="comments-list"
                    style="display:none;">

                </div>


                <div class="comment-input-area">

                    <input
                        type="text"
                        class="comment-input"
                        placeholder="Write a comment...">


                    <button
                        class="comment-submit">

                        Send

                    </button>

                </div>

            </div>

        `;


        postsContainer.appendChild(
            post
        );


        setupLike(
            post,
            postId,
            postData,
            likedBy,
            likes
        );


        setupDelete(
            post,
            postId,
            postData
        );


        setupComments(
            post,
            postId
        );

    }


    // =========================
    // LIKE
    // =========================

    function setupLike(
        post,
        postId,
        postData,
        originalLikedBy,
        originalLikes
    ) {

        const button =
            post.querySelector(
                ".like-btn"
            );


        const count =
            post.querySelector(
                ".like-count"
            );


        button.addEventListener(
            "click",
            async () => {

                const user =
                    auth.currentUser;


                if (!user) {

                    alert(
                        "Please login first."
                    );

                    return;
                }


                try {

                    const likedBy =
                        Array.isArray(
                            originalLikedBy
                        )
                        ? [...originalLikedBy]
                        : [];


                    let likes =
                        Number(
                            originalLikes
                        );


                    if (
                        likedBy.includes(
                            user.uid
                        )
                    ) {

                        const index =
                            likedBy.indexOf(
                                user.uid
                            );


                        likedBy.splice(
                            index,
                            1
                        );


                        likes =
                            Math.max(
                                0,
                                likes - 1
                            );


                    } else {

                        likedBy.push(
                            user.uid
                        );


                        likes++;

                    }


                    await updateDoc(

                        doc(
                            db,
                            "posts",
                            postId
                        ),

                        {
                            likes:
                                likes,

                            likedBy:
                                likedBy
                        }

                    );


                    button.textContent =
                        likedBy.includes(
                            user.uid
                        )
                        ? "❤️ Liked"
                        : "👍 Like";


                    count.textContent =
                        "Likes: " + likes;


                } catch (error) {

                    console.error(
                        "LIKE ERROR:",
                        error
                    );


                    alert(
                        "Like failed: " +
                        error.message
                    );

                }

            }
        );

    }


    // =========================
    // DELETE POST
    // =========================

    function setupDelete(
        post,
        postId,
        postData
    ) {

        const button =
            post.querySelector(
                ".delete-post-btn"
            );


        if (!button) {

            return;

        }


        button.addEventListener(
            "click",
            async () => {

                if (
                    !confirm(
                        "Delete this post?"
                    )
                ) {

                    return;

                }


                const user =
                    auth.currentUser;


                if (
                    !user ||
                    user.uid !==
                    postData.uid
                ) {

                    alert(
                        "You can only delete your own post."
                    );

                    return;

                }


                try {

                    await deleteDoc(

                        doc(
                            db,
                            "posts",
                            postId
                        )

                    );


                } catch (error) {

                    console.error(
                        "DELETE ERROR:",
                        error
                    );


                    alert(
                        "Delete failed: " +
                        error.message
                    );

                }

            }
        );

    }


    // =========================
    // COMMENTS
    // =========================

    function setupComments(
        post,
        postId
    ) {

        const showButton =
            post.querySelector(
                ".show-comments-btn"
            );


        const commentsList =
            post.querySelector(
                ".comments-list"
            );


        const input =
            post.querySelector(
                ".comment-input"
            );


        const sendButton =
            post.querySelector(
                ".comment-submit"
            );


        let visible =
            false;


        showButton.addEventListener(
            "click",
            () => {

                visible =
                    !visible;


                commentsList.style.display =
                    visible
                    ? "block"
                    : "none";


                showButton.textContent =
                    visible
                    ? "💬 Hide comments"
                    : "💬 View comments";


                if (visible) {

                    loadComments();

                }

            }
        );


        post.querySelector(
            ".comment-btn"
        ).addEventListener(
            "click",
            () => {

                input.focus();

                visible =
                    true;

                commentsList.style.display =
                    "block";

                showButton.textContent =
                    "💬 Hide comments";

                loadComments();

            }
        );


        sendButton.addEventListener(
            "click",
            async () => {

                const user =
                    auth.currentUser;


                if (!user) {

                    alert(
                        "Please login first."
                    );

                    return;

                }


                const text =
                    input.value.trim();


                if (!text) {

                    alert(
                        "Please write a comment."
                    );

                    return;

                }


                try {

                    await addDoc(

                        collection(
                            db,
                            "comments"
                        ),

                        {

                            postId:
                                postId,

                            text:
                                text,

                            userEmail:
                                user.email,

                            uid:
                                user.uid,

                            createdAt:
                                serverTimestamp()

                        }

                    );


                    input.value =
                        "";


                    visible =
                        true;


                    commentsList.style.display =
                        "block";


                    showButton.textContent =
                        "💬 Hide comments";


                    loadComments();

                                        data.text || ""
                                    )}

                                </div>


                                ${

                                    ? `

                                        <button
                                            class="delete-comment-btn">

                                            Delete

                                        </button>

                                      `

                                }

                            </div>

                        `;


                        commentsList.appendChild(

                            div.querySelector(

                            );


                        if (deleteButton) {

                            deleteButton.addEventListener(

                                            "Delete this comment?"

                                    ) {

                                            "Delete failed: " +
                                            error.message
                                        );

                                    }

                                }
                            );

                        }

                    }
                );


            } catch (error) {

                console.error(
                    "COMMENT LOAD ERROR:",
                    error
                );

                commentsList.innerHTML = `

                    <div style="color:#e41e3f;padding:10px;">

                        <br>

                        ${error.message}

                    </div>

                `;

            }

        }

    // =========================
    // CREATE POST
    // =========================

    document.getElementById(
        "postBtn"
    ).addEventListener(
        "click",
        async () => {

            const user =
                auth.currentUser;


            if (!user) {

                alert(
                    "Please login first."
                );

                return;

            }


            const textarea =
                document.getElementById(
                    "postText"
                );


            const text =
                textarea.value.trim();


            if (!text) {

                alert(
                    "Please write something."
                );

                return;

            }


            try {

                await addDoc(

                    collection(
                        db,
                        "posts"
                    ),

                    {

                        text:
                            text,

                        uid:
                            user.uid,

                        userEmail:
                            user.email,

                        createdAt:
                            serverTimestamp(),

                        likes:
                            0,

                        likedBy:
                            []

                    }

                );


                textarea.value =
                    "";


            } catch (error) {

                console.error(
                    "POST ERROR:",
                    error
                );


                alert(
                    "Could not create post: " +
                    error.message
                );

            }

        }
    );


    // =========================
    // LOGOUT
    // =========================

    document.getElementById(
        "logoutBtn"
    ).addEventListener(
        "click",
        async () => {

            try {

                await signOut(
                    auth
                );

                window.location.href =
                    "index.html";

            } catch (error) {

                console.error(
                    "LOGOUT ERROR:",
                    error
                );

            }

        }
    );


    // =========================
    // SECURITY
    // =========================

    function escapeHTML(value) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            value;


        return div.innerHTML;

    }

</script>
