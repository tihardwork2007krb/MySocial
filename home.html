    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        import {
            getFirestore,
            collection,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            getDoc,
            getDocs,
            setDoc,
            serverTimestamp,
            query,
            where,
            orderBy,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyA0jZCLoUdlC8ZghIMUSbBmrkucw6f6va4",

            authDomain:
                "mysocial-6f06e.firebaseapp.com",

            projectId:
                "mysocial-6f06e",

            storageBucket:
                "mysocial-6f06e.firebasestorage.app",

            messagingSenderId:
                "78141811564",

            appId:
                "1:78141811564:web:3ebc1dba5303e552a12149",

            measurementId:
                "G-E19NQ06DZB"
        };


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        const postsContainer =
            document.getElementById("posts");

        const postText =
            document.getElementById("postText");

        const postBtn =
            document.getElementById("postBtn");

        const imageInput =
            document.getElementById("imageInput");

        const imagePreview =
            document.getElementById("imagePreview");

        const removeImage =
            document.getElementById("removeImage");

        let currentUser = null;

        let selectedImageData = null;

        let unsubscribePostListeners = [];


        /* =========================
           IMAGE COMPRESSION
        ========================= */

        function compressImage(file) {

            return new Promise((resolve, reject) => {

                const reader = new FileReader();

                reader.onload = function(event) {

                    const img = new Image();

                    img.onload = function() {

                        const maxWidth = 1000;

                        let width = img.width;
                        let height = img.height;


                        if (width > maxWidth) {

                            height =
                                height *
                                (maxWidth / width);

                            width =
                                maxWidth;

                        }


                        const canvas =
                            document.createElement(
                                "canvas"
                            );

                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        const ctx =
                            canvas.getContext(
                                "2d"
                            );


                        ctx.drawImage(
                            img,
                            0,
                            0,
                            width,
                            height
                        );


                        const compressed =
                            canvas.toDataURL(
                                "image/jpeg",
                                0.70
                            );


                        resolve(
                            compressed
                        );

                    };


                    img.onerror =
                        reject;

                    img.src =
                        event.target.result;

                };


                reader.onerror =
                    reject;

                reader.readAsDataURL(file);

            });

        }


        /* =========================
           SELECT IMAGE
        ========================= */

        imageInput.addEventListener(
            "change",
            async () => {

                const file =
                    imageInput.files[0];


                if (!file) {

                    return;

                }


                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    alert(
                        "Please select an image."
                    );

                    imageInput.value = "";

                    return;

                }


                try {

                    selectedImageData =
                        await compressImage(
                            file
                        );


                    imagePreview.src =
                        selectedImageData;

                    imagePreview.style.display =
                        "block";

                    removeImage.style.display =
                        "inline-block";


                } catch (error) {

                    console.error(
                        "Image error:",
                        error
                    );

                    alert(
                        "Could not process image."
                    );

                }

            }
        );


        /* =========================
           REMOVE IMAGE
        ========================= */

        removeImage.addEventListener(
            "click",
            () => {

                selectedImageData =
                    null;

                imageInput.value =
                    "";

                imagePreview.src =
                    "";

                imagePreview.style.display =
                    "none";

                removeImage.style.display =
                    "none";

            }
        );


        /* =========================
           FRIENDSHIP ID
        ========================= */

        function friendshipId(uid1, uid2) {

            return [uid1, uid2]
                .sort()
                .join("_");

        }


        /* =========================
           CREATE FRIENDSHIP DOCUMENTS
           
           Existing accepted requests
           are converted into friendship
           documents.
        ========================= */

        async function syncFriendships() {

            if (!currentUser) {
                return [];
            }


            const friendIds = new Set();


            const sentQuery =
                query(
                    collection(
                        db,
                        "friendRequests"
                    ),
                    where(
                        "from",
                        "==",
                        currentUser.uid
                    ),
                    where(
                        "status",
                        "==",
                        "accepted"
                    )
                );


            const receivedQuery =
                query(
                    collection(
                        db,
                        "friendRequests"
                    ),
                    where(
                        "to",
                        "==",
                        currentUser.uid
                    ),
                    where(
                        "status",
                        "==",
                        "accepted"
                    )
                );


            const sentSnapshot =
                await getDocs(
                    sentQuery
                );


            const receivedSnapshot =
                await getDocs(
                    receivedQuery
                );


            for (
                const requestDoc
                of sentSnapshot.docs
            ) {

                const data =
                    requestDoc.data();

                const friendUid =
                    data.to;


                friendIds.add(
                    friendUid
                );


                await setDoc(
                    doc(
                        db,
                        "friendships",
                        friendshipId(
                            currentUser.uid,
                            friendUid
                        )
                    ),
                    {
                        users: [
                            currentUser.uid,
                            friendUid
                        ],
                        createdAt:
                            data.createdAt ||
                            serverTimestamp()
                    },
                    {
                        merge: true
                    }
                );

            }


            for (
                const requestDoc
                of receivedSnapshot.docs
            ) {

                const data =
                    requestDoc.data();

                const friendUid =
                    data.from;


                friendIds.add(
                    friendUid
                );


                await setDoc(
                    doc(
                        db,
                        "friendships",
                        friendshipId(
                            currentUser.uid,
                            friendUid
                        )
                    ),
                    {
                        users: [
                            currentUser.uid,
                            friendUid
                        ],
                        createdAt:
                            data.createdAt ||
                            serverTimestamp()
                    },
                    {
                        merge: true
                    }
                );

            }


            return [...friendIds];

        }


        /* =========================
           LOGIN
        ========================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    window.location.href =
                        "index.html";

                    return;

                }


                currentUser =
                    user;


                document.getElementById(
                    "userEmail"
                ).textContent =
                    user.email ||
                    "User";


                try {

                    const profileRef =
                        doc(
                            db,
                            "users",
                            user.uid
                        );


                    const profileSnapshot =
                        await getDoc(
                            profileRef
                        );


                    if (
                        !profileSnapshot.exists()
                    ) {

                        alert(
                            "Please complete your profile first."
                        );

                        window.location.href =
                            "profile.html";

                        return;

                    }


                    const profileData =
                        profileSnapshot.data();


                    if (
                        !profileData.name ||
                        profileData.name.trim() === ""
                    ) {

                        alert(
                            "Please complete your profile first."
                        );

                        window.location.href =
                            "profile.html";

                        return;

                    }


                    await syncFriendships();

                    loadFeed();

                } catch (error) {

                    console.error(
                        "Startup error:",
                        error
                    );


                    postsContainer.innerHTML = `

                        <div class="message">

                            Could not load your feed.

                            <br><br>

                            ${error.message}

                        </div>

                    `;

                }

            }
        );


        /* =========================
           LOGOUT
        ========================= */

        document.getElementById(
            "logoutBtn"
        ).addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                } catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                }

            }
        );


        /* =========================
           CREATE POST
        ========================= */

        postBtn.addEventListener(
            "click",
            async () => {

                if (!currentUser) {

                    alert(
                        "Please login first."
                    );

                    return;

                }


                const text =
                    postText.value.trim();


                if (
                    text === "" &&
                    !selectedImageData
                ) {

                    alert(
                        "Write something or select an image."
                    );

                    return;

                }


                postBtn.disabled =
                    true;

                postBtn.textContent =
                    "Posting...";


                try {

                    await addDoc(
                        collection(
                            db,
                            "posts"
                        ),
                        {

                            uid:
                                currentUser.uid,

                            userEmail:
                                currentUser.email,

                            text:
                                text,

                            image:
                                selectedImageData || "",

                            likes:
                                0,

                            likedBy:
                                [],

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    postText.value =
                        "";

                    selectedImageData =
                        null;

                    imageInput.value =
                        "";

                    imagePreview.src =
                        "";

                    imagePreview.style.display =
                        "none";

                    removeImage.style.display =
                        "none";


                    alert(
                        "Post published successfully!"
                    );


                } catch (error) {

                    console.error(
                        "POST ERROR:",
                        error
                    );


                    alert(
                        "Could not create post: " +
                        error.message
                    );

                }


                postBtn.disabled =
                    false;

                postBtn.textContent =
                    "Post";

            }
        );


        /* =========================
           LOAD FRIEND FEED
        ========================= */

        async function loadFeed() {

            unsubscribePostListeners.forEach(
                unsubscribe =>
                    unsubscribe()
            );

            unsubscribePostListeners =
                [];


            postsContainer.innerHTML =
                `<div class="loading">
                    Loading your posts...
                </div>`;


            try {

                const friendIds =
                    await syncFriendships();


                const allowedUsers =
                    [
                        currentUser.uid,
                        ...friendIds
                    ];


                postsContainer.innerHTML =
                    "";


                let allPosts = [];


                /*
                 * Load our own posts.
                 */

                const ownQuery =
                    query(
                        collection(
                            db,
                            "posts"
                        ),
                        where(
                            "uid",
                            "==",
                            currentUser.uid
                        )
                    );


                const ownSnapshot =
                    await getDocs(
                        ownQuery
                    );


                ownSnapshot.forEach(
                    postDoc => {

                        allPosts.push({

                            id:
                                postDoc.id,

                            data:
                                postDoc.data()

                        });

                    }
                );


                /*
                 * Load each friend's posts.
                 */

                for (
                    const friendUid
                    of friendIds
                ) {

                    const friendQuery =
                        query(
                            collection(
                                db,
                                "posts"
                            ),
                            where(
                                "uid",
                                "==",
                                friendUid
                            )
                        );


                    const friendSnapshot =
                        await getDocs(
                            friendQuery
                        );


                    friendSnapshot.forEach(
                        postDoc => {

                            allPosts.push({

                                id:
                                    postDoc.id,

                                data:
                                    postDoc.data()

                            });

                        }
                    );

                }


                /*
                 * Extra client-side safety.
                 */

                allPosts =
                    allPosts.filter(
                        item =>
                            allowedUsers.includes(
                                item.data.uid
                            )
                    );


                /*
                 * Newest first.
                 */

                allPosts.sort(
                    (a, b) => {

                        const aTime =
                            a.data.createdAt
                            ? a.data.createdAt.toMillis()
                            : 0;

                        const bTime =
                            b.data.createdAt
                            ? b.data.createdAt.toMillis()
                            : 0;

                        return bTime - aTime;

                    }
                );


                if (
                    allPosts.length === 0
                ) {

                    postsContainer.innerHTML =
                        `<div class="message">
                            No posts from you or your friends yet.
                        </div>`;

                    return;

                }


                allPosts.forEach(
                    item => {

                        displayPost(
                            item.id,
                            item.data
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "FEED ERROR:",
                    error
                );


                postsContainer.innerHTML = `

                    <div class="message"
                         style="color:#e41e3f;">

                        Could not load posts.

                        <br><br>

                        ${error.message}

                    </div>

                `;

            }

        }


        /* =========================
           DISPLAY POST
        ========================= */

        function displayPost(
            postId,
            postData
        ) {

            const post =
                document.createElement(
                    "div"
                );


            post.className =
                "post";


            const email =
                postData.userEmail ||
                "User";


            const avatar =
                email
                    .substring(0, 2)
                    .toUpperCase();


            let timeText =
                "Just now";


            if (
                postData.createdAt
            ) {

                timeText =
                    postData.createdAt
                        .toDate()
                        .toLocaleString();

            }


            const likes =
                Number(
                    postData.likes || 0
                );


            const likedBy =
                Array.isArray(
                    postData.likedBy
                )
                ? postData.likedBy
                : [];


            const userLiked =
                likedBy.includes(
                    currentUser.uid
                );


            post.innerHTML = `

                <div class="post-header">

                    <div class="avatar">
                        ${avatar}
                    </div>

                    <div>

                        <div class="post-user">
                            ${escapeHtml(email)}
                        </div>

                        <div class="post-time">
                            ${timeText}
                        </div>

                    </div>

                </div>


                ${
                    postData.text
                    ? `
                        <div class="post-content">
                            ${escapeHtml(
                                postData.text
                            )}
                        </div>
                    `
                    : ""
                }


                ${
                    postData.image
                    ? `
                        <img
                            class="post-image"
                            src="${postData.image}"
                            alt="Post image">
                    `
                    : ""
                }


                <div class="post-actions">

                    <button
                        class="action-btn like-btn">

                        ${
                            userLiked
                            ? "❤️ Liked"
                            : "👍 Like"
                        }

                    </button>


                    <button
                        class="action-btn comment-btn">

                        💬 Comment

                    </button>


                    ${
                        postData.uid ===
                        currentUser.uid

                        ? `
                            <button
                                class="action-btn delete-post-btn">

                                🗑️ Delete

                            </button>
                        `
                        : ""
                    }

                </div>


                <div class="like-count">

                    Likes: ${likes}

                </div>


                <div class="comments-section">

                    <button
                        class="show-comments-btn">

                        💬 View comments

                    </button>


                    <div
                        class="comments-list"
                        style="display:none;">
                    </div>


                    <div
                        class="comment-input-area">

                        <input
                            type="text"
                            class="comment-input"
                            placeholder="Write a comment...">

                        <button
                            class="comment-submit">

                            Send

                        </button>

                    </div>

                </div>

            `;


            postsContainer.appendChild(
                post
            );


            /* =========================
               LIKE
            ========================= */

            const likeButton =
                post.querySelector(
                    ".like-btn"
                );


            likeButton.addEventListener(
                "click",
                async () => {

                    try {

                        const postRef =
                            doc(
                                db,
                                "posts",
                                postId
                            );


                        const snapshot =
                            await getDoc(
                                postRef
                            );


                        if (
                            !snapshot.exists()
                        ) {

                            alert(
                                "Post no longer exists."
                            );

                            return;

                        }


                        const data =
                            snapshot.data();


                        let newLikedBy =
                            Array.isArray(
                                data.likedBy
                            )
                            ? [
                                ...data.likedBy
                            ]
                            : [];


                        let newLikes =
                            Number(
                                data.likes || 0
                            );


                        if (
                            newLikedBy.includes(
                                currentUser.uid
                            )
                        ) {

                            newLikedBy =
                                newLikedBy.filter(
                                    uid =>
                                        uid !==
                                        currentUser.uid
                                );

                            newLikes =
                                Math.max(
                                    0,
                                    newLikes - 1
                                );

                        } else {

                            newLikedBy.push(
                                currentUser.uid
                            );

                            newLikes++;

                        }


                        await updateDoc(
                            postRef,
                            {

                                likes:
                                    newLikes,

                                likedBy:
                                    newLikedBy

                            }
                        );


                        displayPostAfterUpdate(
                            postId,
                            post
                        );


                    } catch (error) {

                        console.error(
                            "LIKE ERROR:",
                            error
                        );


                        alert(
                            "Like failed: " +
                            error.message
                        );

                    }

                }
            );


            /* =========================
               DELETE POST
            ========================= */

            const deleteButton =
                post.querySelector(
                    ".delete-post-btn"
                );


            if (deleteButton) {

                deleteButton.addEventListener(
                    "click",
                    async () => {

                        if (
                            !confirm(
                                "Delete this post?"
                            )
                        ) {

                            return;

                        }


                        try {

                            await deleteDoc(
                                doc(
                                    db,
                                    "posts",
                                    postId
                                )
                            );


                            post.remove();


                        } catch (error) {

                            console.error(
                                "DELETE ERROR:",
                                error
                            );


                            alert(
                                "Delete failed: " +
                                error.message
                            );

                        }

                    }
                );

            }


            /* =========================
               COMMENTS
            ========================= */

            const commentsList =
                post.querySelector(
                    ".comments-list"
                );


            const showComments =
                post.querySelector(
                    ".show-comments-btn"
                );


            const commentInput =
                post.querySelector(
                    ".comment-input"
                );


            const commentSubmit =
                post.querySelector(
                    ".comment-submit"
                );


            let commentsVisible =
                false;


            showComments.addEventListener(
                "click",
                () => {

                    commentsVisible =
                        !commentsVisible;


                    commentsList.style.display =
                        commentsVisible
                        ? "block"
                        : "none";


                    showComments.textContent =
                        commentsVisible
                        ? "💬 Hide comments"
                        : "💬 View comments";

                }
            );


            post.querySelector(
                ".comment-btn"
            ).addEventListener(
                "click",
                () => {

                    commentsVisible =
                        true;

                    commentsList.style.display =
                        "block";

                    showComments.textContent =
                        "💬 Hide comments";

                    commentInput.focus();

                }
            );


            commentSubmit.addEventListener(
                "click",
                async () => {

                    const text =
                        commentInput.value.trim();


                    if (!text) {

                        alert(
                            "Please write a comment."
                        );

                        return;

                    }


                    try {

                        await addDoc(
                            collection(
                                db,
                                "comments"
                            ),
                            {

                                postId:
                                    postId,

                                text:
                                    text,

                                uid:
                                    currentUser.uid,

                                userEmail:
                                    currentUser.email,

                                createdAt:
                                    serverTimestamp()

                            }
                        );


                        commentInput.value =
                            "";


                    } catch (error) {

                        console.error(
                            "COMMENT ERROR:",
                            error
                        );


                        alert(
                            "Comment failed: " +
                            error.message
                        );

                    }

                }
            );


            loadComments(
                postId,
                commentsList
            );

        }


        /* =========================
           UPDATE LIKE UI
        ========================= */

        async function displayPostAfterUpdate(
            postId,
            postElement
        ) {

            const snapshot =
                await getDoc(
                    doc(
                        db,
                        "posts",
                        postId
                    )
                );


            if (
                !snapshot.exists()
            ) {

                return;

            }


            const data =
                snapshot.data();


            const button =
                postElement.querySelector(
                    ".like-btn"
                );


            const count =
                postElement.querySelector(
                    ".like-count"
                );


            const likedBy =
                Array.isArray(
                    data.likedBy
                )
                ? data.likedBy
                : [];


            button.textContent =
                likedBy.includes(
                    currentUser.uid
                )
                ? "❤️ Liked"
                : "👍 Like";


            count.textContent =
                "Likes: " +
                Number(
                    data.likes || 0
                );

        }


        /* =========================
           LOAD COMMENTS
        ========================= */

        function loadComments(
            postId,
            commentsList
        ) {

            const commentsQuery =
                query(
                    collection(
                        db,
                        "comments"
                    ),
                    where(
                        "postId",
                        "==",
                        postId
                    ),
                    orderBy(
                        "createdAt",
                        "asc"
                    )
                );


            onSnapshot(
                commentsQuery,
                snapshot => {

                    commentsList.innerHTML =
                        "";


                    snapshot.forEach(
                        commentDoc => {

                            const data =
                                commentDoc.data();


                            const comment =
                                document.createElement(
                                    "div"
                                );


                            comment.className =
                                "comment";


                            const email =
                                data.userEmail ||
                                "User";


                            comment.innerHTML = `

                                <div class="comment-avatar">

                                    ${escapeHtml(
                                        email
                                            .substring(
                                                0,
                                                2
                                            )
                                            .toUpperCase()
                                    )}

                                </div>


                                <div class="comment-body">

                                    <div class="comment-user">

                                        ${escapeHtml(
                                            email
                                        )}

                                    </div>


                                    <div class="comment-text">

                                        ${escapeHtml(
                                            data.text ||
                                            ""
                                        )}

                                    </div>


                                    ${
                                        data.uid ===
                                        currentUser.uid

                                        ? `
                                            <button
                                                class="delete-comment-btn">

                                                Delete

                                            </button>
                                        `
                                        : ""
                                    }

                                </div>

                            `;


                            commentsList.appendChild(
                                comment
                            );


                            const deleteButton =
                                comment.querySelector(
                                    ".delete-comment-btn"
                                );


                            if (
                                deleteButton
                            ) {

                                deleteButton.addEventListener(
                                    "click",
                                    async () => {

                                        if (
                                            !confirm(
                                                "Delete this comment?"
                                            )
                                        ) {

                                            return;

                                        }


                                        try {

                                            await deleteDoc(
                                                doc(
                                                    db,
                                                    "comments",
                                                    commentDoc.id
                                                )
                                            );


                                        } catch (error) {

                                            alert(
                                                "Could not delete comment: " +
                                                error.message
                                            );

                                        }

                                    }
                                );

                            }

                        }
                    );

                },
                error => {

                    console.error(
                        "COMMENTS ERROR:",
                        error
                    );

                }
            );

        }


        /* =========================
           HTML ESCAPE
        ========================= */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }

    </script>

</body>

</html>
