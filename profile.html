<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MySocial Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff0f6;
        }

        .navbar {
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #1877f2;
        }

        .back-btn {
            text-decoration: none;
            background: #e4e6eb;
            color: #111;
            padding: 9px 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        .profile-container {
            width: 650px;
            max-width: 95%;
            margin: 30px auto;
        }

        .profile-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 1px 5px rgba(0,0,0,0.15);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 32px;
            font-weight: bold;
        }

        .profile-name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .profile-email {
            color: #65676b;
            margin-bottom: 20px;
        }

        .edit-btn {
            border: none;
            background: #1877f2;
            color: white;
            padding: 11px 20px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .edit-btn:hover {
            background: #166fe5;
        }

        .edit-area {
            display: none;
            margin-top: 20px;
        }

        .edit-area input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 16px;
        }

        .save-btn {
            margin-top: 10px;
            border: none;
            background: #42b72a;
            color: white;
            padding: 11px 20px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">
            MySocial
        </div>

        <a href="home.html" class="back-btn">
            ← Home
        </a>

    </div>


    <div class="profile-container">

        <div class="profile-card">

            <div class="profile-avatar" id="profileAvatar">
                US
            </div>

            <div class="profile-name" id="profileName">
                MySocial User
            </div>

            <div class="profile-email" id="profileEmail">
                Loading...
            </div>

            <button class="edit-btn" id="editBtn">
                Edit Profile
            </button>

            <div class="edit-area" id="editArea">

                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name"
                >

                <br>

                <button class="save-btn" id="saveBtn">
                    Save Profile
                </button>

            </div>

        </div>

    </div>


    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            setDoc
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "AIzaSyA0jZCLoUdlC8ZghIMUSbBmrkucw6f6va4",

            authDomain: "mysocial-6f06e.firebaseapp.com",

            projectId: "mysocial-6f06e",

            storageBucket: "mysocial-6f06e.firebasestorage.app",

            messagingSenderId: "78141811564",

            appId: "1:78141811564:web:3ebc1dba5303e552a12149"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        const profileName =
            document.getElementById("profileName");

        const profileEmail =
            document.getElementById("profileEmail");

        const profileAvatar =
            document.getElementById("profileAvatar");

        const editBtn =
            document.getElementById("editBtn");

        const editArea =
            document.getElementById("editArea");

        const nameInput =
            document.getElementById("nameInput");

        const saveBtn =
            document.getElementById("saveBtn");


        let currentUser = null;


        // CHECK LOGIN

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href = "index.html";

                return;

            }


            currentUser = user;

            profileEmail.textContent = user.email;


            try {

                const profileRef =
                    doc(db, "users", user.uid);

                const profileSnapshot =
                    await getDoc(profileRef);


                if (profileSnapshot.exists()) {

                    const data =
                        profileSnapshot.data();

                    const name =
                        data.name || "MySocial User";

                    profileName.textContent = name;

                    profileAvatar.textContent =
                        name.substring(0, 2).toUpperCase();

                }

            } catch (error) {

                console.error(
                    "Could not load profile:",
                    error
                );

            }

        });


        // EDIT PROFILE

        editBtn.addEventListener("click", () => {

            console.log("Edit button clicked");

            editArea.style.display = "block";

            nameInput.value =
                profileName.textContent;

            nameInput.focus();

        });


        // SAVE PROFILE

        saveBtn.addEventListener("click", async () => {

            const name =
                nameInput.value.trim();


            if (name === "") {

                alert("Please enter your name.");

                return;

            }


            if (!currentUser) {

                alert("You are not logged in.");

                return;

            }


            try {

                await setDoc(

                    doc(
                        db,
                        "users",
                        currentUser.uid
                    ),

                    {
                        name: name,
                        email: currentUser.email,
                        uid: currentUser.uid
                    },

                    {
                        merge: true
                    }

                );


                profileName.textContent = name;

                profileAvatar.textContent =
                    name.substring(0, 2).toUpperCase();

                editArea.style.display = "none";

                alert("Profile saved successfully!");


            } catch (error) {

                console.error(
                    "Save profile error:",
                    error
                );

                alert(
                    "Could not save profile: " +
                    error.message
                );

            }

        });

    </script>

</body>

</html>
